name: Generate 3D contribution graph & Snake animation

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Generate 3D Contribution Graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Generate Contribution Snake Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Remove misleading donut chart from 3D graphs
        run: |
          python3 -c '
          import glob
          for p in glob.glob("profile-3d-contrib/*.svg"):
              with open(p, "r", encoding="utf-8") as f:
                  data = f.read()
              start = data.find("<g transform=\"translate(40, 520)\">")
              end = data.find("<g><text style=\"font-size: 32px;")
              if start != -1 and end > start:
                  data = data[:start] + data[end:]
                  with open(p, "w", encoding="utf-8") as f:
                      f.write(data)
          '

      - name: Save generated assets
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git commit -m "Update 3D graph and snake animations"; then
            git push
          fi
